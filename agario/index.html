<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLOB LAB</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0a0616; }
  #stage { display: block; width: 100vw; height: 100vh; cursor: none; }

  #title {
    position: fixed; left: 16px; top: 14px; z-index: 3;
    font: 600 15px/1.4 ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: .22em; color: #ffd9f0; user-select: none; pointer-events: none;
    text-shadow: 0 0 12px rgba(255,120,190,.5);
  }
  #title small { display: block; font-weight: 400; font-size: 10px;
    letter-spacing: .12em; color: #a884c8; margin-top: 2px; }

  /* mode toolbar */
  #modes {
    position: fixed; left: 50%; top: 14px; transform: translateX(-50%);
    z-index: 6; display: flex; gap: 6px;
  }
  .mode {
    font: 600 12px/1 ui-monospace, Menlo, monospace;
    letter-spacing: .12em; text-transform: uppercase;
    padding: 9px 16px; border-radius: 999px; cursor: pointer;
    background: rgba(20,10,36,.7); border: 1px solid rgba(190,120,220,.3);
    color: #c9a8e6; user-select: none;
    transition: background .15s, color .15s, border-color .15s, box-shadow .15s;
  }
  .mode:hover { border-color: rgba(255,200,230,.6); color: #ffd9f0; }
  .mode.on { background: rgba(255,180,220,.16); border-color: rgba(255,200,230,.95);
    color: #fff; box-shadow: 0 0 18px rgba(255,120,190,.35); }
  .mode b { opacity: .55; font-weight: 400; margin-right: 6px; }

  #hint {
    position: fixed; right: 16px; bottom: 14px; z-index: 3;
    font: 12px/1.5 ui-monospace, Menlo, monospace; letter-spacing: .04em;
    color: #a884c8; opacity: .55; user-select: none; pointer-events: none;
  }
  #count {
    position: fixed; right: 16px; top: 16px; z-index: 3;
    font: 12px/1.5 ui-monospace, Menlo, monospace;
    color: #d9b6ff; opacity: .8; user-select: none; pointer-events: none;
  }
  #count b { color: #ffd98a; }

  #toast {
    position: fixed; left: 50%; top: 30%; transform: translate(-50%,-50%);
    z-index: 4; pointer-events: none; user-select: none;
    font: 600 18px/1.2 ui-monospace, Menlo, monospace;
    letter-spacing: .18em; text-align: center;
    color: #ffdca0; text-shadow: 0 0 24px rgba(255,150,80,.7);
    opacity: 0; transition: opacity .35s ease;
  }
  #toast.show { opacity: 1; }

  /* dev panel */
  #devchip {
    position: fixed; left: 16px; bottom: 14px; z-index: 6;
    font: 11px/1.4 ui-monospace, Menlo, monospace; letter-spacing: .08em;
    color: #a884c8; opacity: .55; cursor: pointer; user-select: none;
  }
  #devchip:hover { opacity: .9; }
  #dev {
    position: fixed; left: 16px; bottom: 40px; z-index: 6; display: none;
    min-width: 252px; padding: 10px 12px 9px;
    max-height: calc(100vh - 120px); overflow-y: auto;
    background: rgba(14,7,26,.88); border: 1px solid rgba(190,120,220,.28);
    border-radius: 10px; backdrop-filter: blur(4px);
    font: 11px/1.7 ui-monospace, Menlo, monospace; color: #d9b6ff;
  }
  .devhead { display: flex; justify-content: space-between; margin-bottom: 6px;
    letter-spacing: .18em; text-transform: uppercase; color: #ffd98a; }
  .devrow { display: grid; grid-template-columns: 100px 1fr 42px; gap: 8px; align-items: center; }
  .devrow label { opacity: .8; }
  .devrow span { text-align: right; color: #ffe6ad; }
  .devrow input[type=range] { width: 100%; accent-color: #ffce7a; height: 3px; }
  .devfoot { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .devfoot button {
    font: 11px ui-monospace, Menlo, monospace; letter-spacing: .1em;
    padding: 3px 10px; border-radius: 6px; cursor: pointer;
    background: rgba(255,214,120,.08); border: 1px solid rgba(255,205,120,.35); color: #ffe6ad;
  }
  .devfoot button:hover { background: rgba(255,214,120,.18); }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div id="title">BLOB&nbsp;LAB<small>a study in blobbyness</small></div>

<div id="modes">
  <div class="mode on" data-mode="spawn"><b>1</b>spawn</div>
  <div class="mode" data-mode="add"><b>2</b>add</div>
  <div class="mode" data-mode="dec"><b>3</b>decrease</div>
  <div class="mode" data-mode="del"><b>4</b>delete</div>
</div>

<div id="count">blobs <b id="nblobs">0</b> · nodes <b id="nnodes">0</b></div>
<div id="toast"></div>
<div id="hint">click to use mode (hold for add/decrease) · 1–4 modes · R clear · ` dev</div>

<div id="devchip">⚙ dev&nbsp;·&nbsp;`</div>
<div id="dev">
  <div class="devhead"><span>goo tuning</span><span id="fps"></span></div>
  <div id="devrows"></div>
  <div class="devfoot">
    <button id="devdefaults" type="button">defaults</button>
    <button id="devpause" type="button">pause</button>
  </div>
</div>

<script>
/* ==================================================================
 *  BLOB LAB — a study in blobbyness
 *
 *  Each blob is a closed membrane of nodes driven by AREA PRESSURE:
 *  the polygon wants its target area (incompressible, like water), so
 *  denting one side makes the rest bulge. Surface tension (edge
 *  springs) + curvature smoothing + damping complete the liquid.
 *
 *  Node count scales with size — bigger blob, more skin resolution.
 *  Membranes are resampled on the fly as blobs grow or shrink, so
 *  deformation is preserved through growth.
 *
 *  Modes: spawn / add (hold) / decrease (hold) / delete.
 *  The cursor itself pushes the goo aside — poke them.
 * ================================================================== */

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const toastEl = document.getElementById('toast');
const nBlobsEl = document.getElementById('nblobs');
const nNodesEl = document.getElementById('nnodes');

let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const rgba = (c, a) => `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const lerpC = (a, b, t) => [lerp(a[0],b[0],t), lerp(a[1],b[1],t), lerp(a[2],b[2],t)];
const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
const TAU = Math.PI * 2;
const gauss = () => (Math.random()+Math.random()+Math.random()-1.5)/1.5;

/* ------------------ dev tuning (press ` any time) ----------------- */
const TUNE_DEF = {
  grow: 9000,     // mass px²/s pumped while holding add / decrease
  seg: 13,        // px of membrane per node (smaller = more resolution)
  pressure: 3200, // incompressibility (the liquid feel)
  tension: 22,    // surface tension (edge springs)
  smooth: 8,      // curvature smoothing
  damp: 2.6,      // velocity damping /s
  wobble: 1,      // idle liveliness noise
  poke: 1100,     // cursor push force
  pokeR: 80,      // cursor push radius
  squish: 500,    // blob-vs-blob softness
  gravity: 0,     // pull everything down (try it)
  drift: 14,      // gentle brownian wander
};
const TUNE = Object.assign({}, TUNE_DEF, { paused: false });
try { Object.assign(TUNE, JSON.parse(localStorage.getItem('bl_tune') || '{}'), { paused: false }); } catch (e) {}
function saveTune() {
  try { const { paused, ...t } = TUNE; localStorage.setItem('bl_tune', JSON.stringify(t)); } catch (e) {}
}

/* ---------------------------- blobs ------------------------------- */
const HUES = [
  [255, 205, 150], [150, 226, 214], [244, 148, 170], [186, 152, 255],
  [166, 226, 148], [140, 178, 255], [255, 178, 128], [222, 142, 226],
  [252, 220, 132], [150, 210, 250], [242, 160, 200], [172, 236, 190],
];
let blobs = [];
const MIN_MASS = 900, MAX_MASS = 260000;

function nodeTarget(mass) {
  const R = Math.sqrt(mass / Math.PI);
  return clamp(Math.round(TAU * R / TUNE.seg), 10, 120);
}
function makeBlob(x, y, mass) {
  const b = {
    x, y, mass,                        // mass IS target area (px²)
    hue: HUES[(Math.random() * HUES.length) | 0],
    nodes: [],
    ph: rand(0, TAU), seed: rand(0, 1000),
    driftA: rand(0, TAU),
    dying: 0,
  };
  const R = Math.sqrt(mass / Math.PI) * 0.25;   // born small — pressure inflates it
  const N = nodeTarget(mass);
  for (let i = 0; i < N; i++) {
    const a = i / N * TAU;
    b.nodes.push({ x: x + Math.cos(a) * R, y: y + Math.sin(a) * R, vx: 0, vy: 0 });
  }
  return b;
}
// change membrane resolution while PRESERVING the current deformed shape
function resample(b, newN) {
  const old = b.nodes, oldN = old.length;
  if (newN === oldN) return;
  const nn = [];
  for (let i = 0; i < newN; i++) {
    const t = i / newN * oldN;
    const i0 = Math.floor(t) % oldN, i1 = (i0 + 1) % oldN, f = t - Math.floor(t);
    nn.push({
      x: lerp(old[i0].x, old[i1].x, f), y: lerp(old[i0].y, old[i1].y, f),
      vx: lerp(old[i0].vx, old[i1].vx, f), vy: lerp(old[i0].vy, old[i1].vy, f),
    });
  }
  b.nodes = nn;
}
function polyArea(nodes) {
  let a = 0;
  for (let i = 0; i < nodes.length; i++) {
    const p = nodes[i], q = nodes[(i + 1) % nodes.length];
    a += p.x * q.y - q.x * p.y;
  }
  return a / 2;
}
function centroid(b) {
  let cx = 0, cy = 0;
  for (const n of b.nodes) { cx += n.x; cy += n.y; }
  b.x = cx / b.nodes.length; b.y = cy / b.nodes.length;
}

let toastT = 0;
function showToast(msg) { toastEl.textContent = msg; toastEl.classList.add('show'); toastT = 1.6; }
const pops = [];

/* ---------------------------- physics ----------------------------- */
let perfNow = 0;
function blobStep(b, h) {
  const N = b.nodes.length;
  const A0 = b.dying > 0 ? b.mass * Math.max(0.001, 1 - b.dying) : b.mass;
  const A = Math.abs(polyArea(b.nodes)) + 1;
  // shared pressure from incompressibility — THE liquid term
  const P = TUNE.pressure * (A0 - A) / A0;
  const R = Math.sqrt(b.mass / Math.PI);
  const restE = TAU * R / N * 0.98;
  const damp = Math.exp(-TUNE.damp * h);
  const t = perfNow;
  for (let i = 0; i < N; i++) {
    const n = b.nodes[i];
    const prev = b.nodes[(i - 1 + N) % N], next = b.nodes[(i + 1) % N];
    // outward normal from neighbors (CCW winding)
    let tx = next.x - prev.x, ty = next.y - prev.y;
    const tl = Math.hypot(tx, ty) + 1e-6;
    const nx = ty / tl, ny = -tx / tl;
    // pressure along the normal
    n.vx += nx * P * h;
    n.vy += ny * P * h;
    // surface tension
    let ex = next.x - n.x, ey = next.y - n.y;
    const ed = Math.hypot(ex, ey) + 1e-6;
    const fe = TUNE.tension * (ed - restE);
    n.vx += (ex / ed) * fe * h; n.vy += (ey / ed) * fe * h;
    next.vx -= (ex / ed) * fe * h; next.vy -= (ey / ed) * fe * h;
    // curvature smoothing
    n.vx += ((prev.x + next.x) / 2 - n.x) * TUNE.smooth * h;
    n.vy += ((prev.y + next.y) / 2 - n.y) * TUNE.smooth * h;
    // idle liveliness: slow travelling ripple
    const wob = TUNE.wobble * 26;
    n.vx += Math.sin(t * 1.3 + b.seed + i * 0.9) * wob * h;
    n.vy += Math.cos(t * 1.1 + b.seed * 2 + i * 1.3) * wob * h;
    // gravity
    n.vy += TUNE.gravity * h;
    // cursor pokes the goo aside
    if (mouse.in) {
      const mdx = n.x - mouse.x, mdy = n.y - mouse.y;
      const md = Math.hypot(mdx, mdy);
      if (md < TUNE.pokeR && md > 0.01) {
        const f = TUNE.poke * (1 - md / TUNE.pokeR);
        n.vx += (mdx / md) * f * h;
        n.vy += (mdy / md) * f * h;
      }
    }
    n.vx *= damp; n.vy *= damp;
    const v = Math.hypot(n.vx, n.vy);
    if (v > 1200) { n.vx *= 1200/v; n.vy *= 1200/v; }
    n.x += n.vx * h; n.y += n.vy * h;
    // walls
    const m = 4;
    if (n.x < m) { n.x = m; if (n.vx < 0) n.vx *= -0.4; }
    if (n.x > W - m) { n.x = W - m; if (n.vx > 0) n.vx *= -0.4; }
    if (n.y < m) { n.y = m; if (n.vy < 0) n.vy *= -0.4; }
    if (n.y > H - m) { n.y = H - m; if (n.vy > 0) n.vy *= -0.4; }
  }
}
// blobs squish each other: nodes are pushed out of other blobs' bodies
function squish(A, B, h) {
  const rA = Math.sqrt(A.mass / Math.PI), rB = Math.sqrt(B.mass / Math.PI);
  const dx = B.x - A.x, dy = B.y - A.y;
  const gate = (rA + rB) * 1.3;
  if (dx > gate || dx < -gate || dy > gate || dy < -gate) return;
  const pairs = [[A, B, rB], [B, A, rA]];
  for (const [me, other, oR] of pairs) {
    for (const n of me.nodes) {
      const ndx = n.x - other.x, ndy = n.y - other.y;
      const nd = Math.hypot(ndx, ndy) + 1e-4;
      if (nd < oR) {
        const f = TUNE.squish * (1 - nd / oR);
        n.vx += (ndx / nd) * f * h;
        n.vy += (ndy / nd) * f * h;
      }
    }
  }
}

/* ----------------------------- modes ------------------------------ */
let modeName = 'spawn';
const modeBtns = [...document.querySelectorAll('.mode')];
function setMode(m) {
  modeName = m;
  for (const btn of modeBtns) btn.classList.toggle('on', btn.dataset.mode === m);
}
for (const btn of modeBtns) btn.addEventListener('click', () => setMode(btn.dataset.mode));

const mouse = { x: -999, y: -999, in: false, down: false };
canvas.addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.in = true; });
canvas.addEventListener('pointerleave', () => { mouse.in = false; mouse.down = false; });
window.addEventListener('pointerup', () => mouse.down = false);
window.addEventListener('blur', () => mouse.down = false);

function blobAt(x, y) {
  let best = null, bd = 1e9;
  for (const b of blobs) {
    const r = Math.sqrt(b.mass / Math.PI);
    const d = Math.hypot(b.x - x, b.y - y);
    if (d < r * 1.25 && d < bd) { bd = d; best = b; }
  }
  return best;
}
canvas.addEventListener('pointerdown', e => {
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.down = true;
  if (modeName === 'spawn') {
    if (blobs.length >= 24) { showToast('the lab is full'); return; }
    blobs.push(makeBlob(mouse.x, mouse.y, 5200));
  } else if (modeName === 'del') {
    const b = blobAt(mouse.x, mouse.y);
    if (b && !b.dying) b.dying = 0.001;      // deflate, then pop
  }
});
window.addEventListener('keydown', e => {
  if (e.key === '1') setMode('spawn');
  else if (e.key === '2') setMode('add');
  else if (e.key === '3') setMode('dec');
  else if (e.key === '4') setMode('del');
  else if (e.key === 'r' || e.key === 'R') { blobs = []; showToast('cleared'); }
  else if (e.key === '`' || e.key === 'd' || e.key === 'D') toggleDev();
  else if (e.key === 'p' || e.key === 'P') togglePause();
});

/* --------------------------- dev panel ---------------------------- */
const PARAMS = [
  ['grow',    'grow rate',    1000, 40000, 500],
  ['seg',     'px per node',  6,    30,    0.5],
  ['pressure','pressure',     500,  9000,  100],
  ['tension', 'tension',      0,    90,    1  ],
  ['smooth',  'smoothing',    0,    30,    0.5],
  ['damp',    'damping',      0.5,  8,     0.1],
  ['wobble',  'wobble',       0,    3,     0.05],
  ['poke',    'poke force',   0,    4000,  50 ],
  ['pokeR',   'poke radius',  20,   240,   5  ],
  ['squish',  'squish',       0,    2000,  25 ],
  ['gravity', 'gravity',      0,    900,   10 ],
  ['drift',   'drift',        0,    80,    1  ],
];
const devPanel = document.getElementById('dev');
const devRows = document.getElementById('devrows');
const fpsEl = document.getElementById('fps');
let devOpen = false;
const devInputs = {};
for (const [key, label, min, max, step] of PARAMS) {
  const row = document.createElement('div'); row.className = 'devrow';
  const lab = document.createElement('label'); lab.textContent = label;
  const inp = document.createElement('input');
  inp.type = 'range'; inp.min = min; inp.max = max; inp.step = step; inp.value = TUNE[key];
  const val = document.createElement('span'); val.textContent = TUNE[key];
  inp.addEventListener('input', () => {
    TUNE[key] = parseFloat(inp.value);
    val.textContent = TUNE[key];
    saveTune();
  });
  devInputs[key] = { inp, val };
  row.append(lab, inp, val);
  devRows.appendChild(row);
}
function toggleDev(force) {
  devOpen = force ?? !devOpen;
  devPanel.style.display = devOpen ? 'block' : 'none';
}
document.getElementById('devchip').addEventListener('click', () => toggleDev());
document.getElementById('devdefaults').addEventListener('click', () => {
  Object.assign(TUNE, TUNE_DEF); saveTune();
  for (const [key] of PARAMS) { devInputs[key].inp.value = TUNE[key]; devInputs[key].val.textContent = TUNE[key]; }
});
const pauseBtn = document.getElementById('devpause');
function togglePause() {
  TUNE.paused = !TUNE.paused;
  pauseBtn.textContent = TUNE.paused ? 'resume' : 'pause';
}
pauseBtn.addEventListener('click', togglePause);

/* --------------------------- drawing ------------------------------ */
function drawBackdrop() {
  ctx.fillStyle = '#0a0616'; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H) * 0.7);
  g.addColorStop(0, 'rgba(60,22,80,0.3)');
  g.addColorStop(1, 'rgba(10,4,20,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function drawBlob(b) {
  const N = b.nodes.length;
  const col = b.hue;
  const R = Math.sqrt(b.mass / Math.PI);
  // glow
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(b.x, b.y, R * 0.3, b.x, b.y, R * 1.9);
  g.addColorStop(0, rgba(col, 0.12));
  g.addColorStop(1, rgba(col, 0));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(b.x, b.y, R * 1.9, 0, TAU); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  // membrane
  ctx.beginPath();
  for (let i = 0; i <= N; i++) {
    const p = b.nodes[i % N], q = b.nodes[(i - 1 + N) % N];
    const mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2;
    if (i === 0) ctx.moveTo(mx, my);
    else ctx.quadraticCurveTo(q.x, q.y, mx, my);
  }
  ctx.closePath();
  const fg = ctx.createRadialGradient(b.x, b.y, R * 0.1, b.x, b.y, R * 1.15);
  fg.addColorStop(0, rgba(lerpC(col, [255,255,255], 0.25), 0.5));
  fg.addColorStop(0.7, rgba(col, 0.34));
  fg.addColorStop(1, rgba(lerpC(col, [20, 8, 34], 0.4), 0.4));
  ctx.fillStyle = fg;
  ctx.fill();
  ctx.lineWidth = Math.max(1.5, R * 0.045);
  ctx.strokeStyle = rgba(col, 0.95);
  ctx.stroke();
  // nucleus glint
  ctx.globalCompositeOperation = 'lighter';
  const ng = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, Math.max(6, R * 0.3));
  ng.addColorStop(0, rgba([255, 252, 244], 0.8));
  ng.addColorStop(1, rgba(col, 0));
  ctx.fillStyle = ng;
  ctx.beginPath(); ctx.arc(b.x, b.y, Math.max(6, R * 0.3), 0, TAU); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
}
function drawCursor() {
  if (!mouse.in) return;
  const colors = { spawn: [255, 217, 240], add: [166, 226, 148], dec: [255, 178, 128], del: [255, 120, 120] };
  const col = colors[modeName];
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = rgba(col, 0.8); ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 8, 0, TAU); ctx.stroke();
  ctx.strokeStyle = rgba(col, 0.25);
  ctx.beginPath(); ctx.arc(mouse.x, mouse.y, TUNE.pokeR, 0, TAU); ctx.stroke();
  ctx.font = '600 10px ui-monospace, Menlo, monospace';
  ctx.textAlign = 'center';
  ctx.fillStyle = rgba(col, 0.8);
  const glyph = { spawn: '+·', add: '▲', dec: '▼', del: '×' }[modeName];
  ctx.fillText(glyph, mouse.x, mouse.y - 14);
  ctx.restore();
}

/* ----------------------------- loop ------------------------------- */
// a few starters so the space isn't empty
blobs.push(makeBlob(W * 0.35, H * 0.5, 9000));
blobs.push(makeBlob(W * 0.62, H * 0.42, 16000));
blobs.push(makeBlob(W * 0.52, H * 0.66, 5000));

let last = performance.now(), fpsE = 60, fpsT = 0;
function frame(now) {
  const dt = Math.min(0.04, (now - last) / 1000);
  last = now; perfNow = now / 1000;

  if (!TUNE.paused && dt > 0) {
    // held add / decrease pumps mass into the blob under the cursor
    if (mouse.down && (modeName === 'add' || modeName === 'dec')) {
      const b = blobAt(mouse.x, mouse.y);
      if (b && !b.dying) {
        const dm = TUNE.grow * dt * (modeName === 'add' ? 1 : -1);
        b.mass = clamp(b.mass + dm, MIN_MASS, MAX_MASS);
      }
    }
    for (let i = blobs.length - 1; i >= 0; i--) {
      const b = blobs[i];
      // death: deflate then pop
      if (b.dying > 0) {
        b.dying += dt * 2.2;
        if (b.dying >= 1) {
          pops.push({ x: b.x, y: b.y, r0: Math.sqrt(b.mass/Math.PI) * 0.5, t: 1, hue: b.hue });
          blobs.splice(i, 1);
          continue;
        }
      }
      // resolution follows size (hysteresis so it doesn't thrash)
      const want = nodeTarget(b.mass);
      if (Math.abs(want - b.nodes.length) >= 2) resample(b, want);
      // gentle brownian drift keeps the space alive
      b.driftA += gauss() * dt * 2;
      const fx = Math.cos(b.driftA) * TUNE.drift, fy = Math.sin(b.driftA) * TUNE.drift;
      for (const n of b.nodes) { n.vx += fx * dt; n.vy += fy * dt; }
    }
    // physics substeps
    const nSub = clamp(Math.ceil(dt / 0.008), 1, 4), h = dt / nSub;
    for (let s = 0; s < nSub; s++) {
      for (const b of blobs) blobStep(b, h);
      for (let i = 0; i < blobs.length; i++)
        for (let j = i + 1; j < blobs.length; j++)
          squish(blobs[i], blobs[j], h);
    }
    for (const b of blobs) centroid(b);
  }

  fpsE += (1 / Math.max(dt, 1e-3) - fpsE) * 0.06;
  fpsT -= dt;
  if (devOpen && fpsT <= 0) { fpsEl.textContent = Math.round(fpsE) + ' fps'; fpsT = 0.25; }

  drawBackdrop();
  for (const b of blobs) drawBlob(b);
  ctx.globalCompositeOperation = 'lighter';
  for (let i = pops.length - 1; i >= 0; i--) {
    const p = pops[i];
    p.t -= dt * 1.6;
    if (p.t <= 0) { pops.splice(i, 1); continue; }
    const R = p.r0 + (1 - p.t) * p.r0 * 5;
    ctx.strokeStyle = rgba(p.hue, p.t * 0.8); ctx.lineWidth = 2.5 * p.t + 0.5;
    ctx.beginPath(); ctx.arc(p.x, p.y, R, 0, TAU); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
  drawCursor();

  if (toastT > 0) { toastT -= dt; if (toastT <= 0) toastEl.classList.remove('show'); }
  nBlobsEl.textContent = blobs.length;
  nNodesEl.textContent = blobs.reduce((a, b) => a + b.nodes.length, 0);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
