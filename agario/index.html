<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravity Well — a fractal-galaxy agar toy</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #070311; }
  #stage { display: block; width: 100vw; height: 100vh; cursor: default; }

  .panel {
    position: fixed; z-index: 3;
    font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: .04em; user-select: none; pointer-events: none;
    text-shadow: 0 0 8px rgba(120,40,180,.6);
  }
  #stats { left: 16px; top: 14px; color: #d9b6ff; }
  #stats .big { font-size: 20px; color: #ffe6ad; font-weight: 600; letter-spacing: .02em; }
  #stats .row { opacity: .82; }
  #stats b { color: #ffd98a; font-weight: 600; }
  #stats .rank b { color: #ffe6ad; }
  #hint { right: 16px; bottom: 14px; color: #a884c8; opacity: .55; }

  #toast {
    position: fixed; left: 50%; top: 32%; transform: translate(-50%,-50%);
    z-index: 4; pointer-events: none; user-select: none;
    font: 600 22px/1.2 ui-monospace, Menlo, monospace;
    letter-spacing: .18em; text-indent: .18em; text-align: center;
    color: #ffdca0; text-shadow: 0 0 24px rgba(255,150,80,.7);
    opacity: 0; transition: opacity .35s ease;
  }
  #toast.show { opacity: 1; }

  /* intro overlay */
  #intro {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 24px; text-align: center;
    pointer-events: none; transition: opacity .9s ease;
  }
  #intro.gone { opacity: 0; }
  #intro .sub {
    font: 12px/1.6 ui-monospace, Menlo, monospace;
    letter-spacing: .4em; text-indent: .4em;
    color: #e6b7ff; opacity: .72; text-transform: uppercase;
  }
  #intro h1 {
    margin: 0;
    font: 300 clamp(32px, 7.5vw, 82px)/0.98 "Avenir Next", "Segoe UI", system-ui, sans-serif;
    letter-spacing: .16em; text-indent: .16em; color: #fff;
    text-shadow: 0 0 34px rgba(255,190,110,.5), 0 0 70px rgba(190,60,160,.35);
  }
  #intro .tag {
    max-width: 34ch;
    font: 13px/1.7 ui-monospace, Menlo, monospace;
    color: #c9a8e6; opacity: .7;
  }
  #dive {
    pointer-events: auto; cursor: pointer; margin-top: 4px;
    padding: 13px 30px; border-radius: 999px;
    background: rgba(255,214,120,.06); border: 1px solid rgba(255,205,120,.5);
    color: #ffe6ad; font: 600 13px/1 ui-monospace, Menlo, monospace;
    letter-spacing: .28em; text-indent: .28em; text-transform: uppercase;
    backdrop-filter: blur(3px);
    transition: background .25s, box-shadow .25s, transform .25s, border-color .25s;
  }
  #dive:hover {
    background: rgba(255,214,120,.16); border-color: rgba(255,224,150,.9);
    box-shadow: 0 0 34px rgba(255,180,90,.35); transform: translateY(-1px);
  }
  #dive:active { transform: translateY(0); }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div id="intro">
  <div class="sub">gravity well</div>
  <h1>A&nbsp;GALAXY&nbsp;OF&nbsp;GALAXIES</h1>
  <div class="tag">you are a speck of gravity. pull stars into orbit and grow. dart through a <b style="color:#ff8a8a">bigger</b> well to siphon its swarm; ram a <b style="color:#9cf0a8">smaller</b> core to swallow it whole.</div>
  <button id="dive" type="button">dive in ↯</button>
</div>

<div id="stats" class="panel">
  <div class="big">mass <b id="mass">0</b></div>
  <div class="row">stars&nbsp; <b id="stars">0</b></div>
  <div class="row">reach&nbsp; <b id="reach">0</b></div>
  <div class="row rank">rank&nbsp;&nbsp; <b id="rank">—</b></div>
</div>
<div id="toast"></div>
<div id="hint" class="panel">steer with the mouse · scroll to peek · esc to pull back · R to reset</div>

<script>
/* ==================================================================
 *  GRAVITY WELL — a fractal-galaxy agar toy
 *
 *  The map is one galaxy of galaxies. You are a gravity well: free
 *  stars inside your reach spiral in and lock into ORBIT around you —
 *  your accretion swarm. That swarm is your mass and your body; the
 *  more you hold the wider your reach.
 *
 *  Rival wells (bots) feed too. When a bigger well's reach laps over a
 *  smaller one it peels the outer stars off their swarm; catch their
 *  core and you swallow them whole. Everyone respawns.
 *
 *  Star squares keep the twinkle "diamond" mark from the visual:
 *              .
 *              o
 *          . o [] o .
 *              o
 *              .
 * ================================================================== */

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const intro = document.getElementById('intro');
const massEl = document.getElementById('mass');
const starsEl = document.getElementById('stars');
const reachEl = document.getElementById('reach');
const rankEl = document.getElementById('rank');
const toastEl = document.getElementById('toast');

let W = 0, H = 0, DPR = 1, MINSIDE = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight; MINSIDE = Math.min(W, H);
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

/* ---------- palette: MATLAB-ish sunset ramp by "grade" ---------- */
const STOPS = [
  [0.00, [120, 46, 150]],
  [0.22, [176, 44, 132]],
  [0.44, [226, 84,  96]],
  [0.64, [248, 148, 58]],
  [0.82, [255, 216, 120]],
  [1.00, [255, 252, 232]],
];
function ramp(t) {
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  for (let i = 1; i < STOPS.length; i++) {
    if (t <= STOPS[i][0]) {
      const [t0, c0] = STOPS[i-1], [t1, c1] = STOPS[i];
      const f = (t - t0) / (t1 - t0);
      return [c0[0]+(c1[0]-c0[0])*f, c0[1]+(c1[1]-c0[1])*f, c0[2]+(c1[2]-c0[2])*f];
    }
  }
  return STOPS[STOPS.length-1][1];
}
const rgba = (c, a) => `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
const clamp01 = t => t < 0 ? 0 : t > 1 ? 1 : t;
const easeInOut = t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
const TAU = Math.PI * 2;
const gauss = () => (Math.random()+Math.random()+Math.random()-1.5)/1.5;

/* ------------------------- the world ---------------------------- */
const WORLD_R = 4600;
const galaxies = [];
let stars = [];

function makeStar(gal, gradeBias) {
  const g = clamp01(Math.pow(Math.random(), 2.2) * (gradeBias ?? 1) + gauss()*0.04);
  const size = lerp(1.3, 17, Math.pow(g, 1.4));
  return {
    gx: gal.x, gy: gal.y, om: gal.omega,
    size, mass: size * size * 0.06,
    warm: clamp01(0.12 + g * 0.86 + gauss()*0.05),
    phase: rand(0, TAU), tw: rand(0.7, 2.6),
    captured: false, vx: 0, vy: 0, x: 0, y: 0,
    hr: 0, ha: 0,
  };
}
function seatStar(s, gal) {
  const arms = gal.arms, wind = gal.wind;
  const rr = Math.pow(Math.random(), 0.6);
  const arm = (Math.floor(Math.random() * arms) / arms) * TAU;
  let ang = arm + rr * wind * TAU + gauss() * (0.18 + 0.4 * rr);
  let hr = rr * gal.r;
  if (Math.random() < 0.5) {                 // clump into a sub-cluster knot (fractal feel)
    const knot = Math.floor(rr * 5) / 5 + 0.1;
    hr = knot * gal.r + gauss() * gal.r * 0.06;
    ang = arm + knot * wind * TAU + gauss() * 0.14;
  }
  s.hr = hr; s.ha = ang;
  s.gx = gal.x; s.gy = gal.y; s.om = gal.omega;
  s.x = gal.x + Math.cos(ang) * hr;
  s.y = gal.y + Math.sin(ang) * hr;
  s.captured = false; s.vx = 0; s.vy = 0;
}
function buildWorld() {
  galaxies.length = 0; stars = [];
  const N = 8;
  for (let i = 0; i < N; i++) {
    const t = i / (N - 1);
    const ang = t * TAU * 1.35 + 0.6;
    const rad = t * WORLD_R * 0.82;
    const r = lerp(1050, 360, t) * rand(0.85, 1.12);
    galaxies.push({
      x: Math.cos(ang) * rad, y: Math.sin(ang) * rad, r,
      omega: rand(0.03, 0.09) * (Math.random() < 0.5 ? -1 : 1),
      arms: 2 + (Math.floor(Math.random()*3)), wind: rand(1.8, 3.0),
    });
  }
  const TOTAL = clamp(Math.round((W*H)/1500) * 2, 1500, 2800);
  const wsum = galaxies.reduce((a, g) => a + g.r, 0);
  for (const gal of galaxies) {
    const n = Math.round(TOTAL * (gal.r / wsum));
    for (let k = 0; k < n; k++) { const s = makeStar(gal); seatStar(s, gal); stars.push(s); }
  }
}
function respawnStar(s) {
  const gal = galaxies[(Math.random() * galaxies.length) | 0];
  Object.assign(s, makeStar(gal, 0.85));
  seatStar(s, gal);
}

/* ---------------------- wells (player + bots) -------------------- */
const GR_K = 16, CORE_K = 2.6, SIZE_EXP = 0.42, ORB_CAP = 72;
const PULL = 900;         // radial infall accel on free stars
const SWIRL = 1150;       // tangential accel -> stars arrive with angular momentum
const CAPTURE_BAND = 0.62;// convert a free star to an orbiter within this fraction of reach
const GRAV = 2100;        // gravitational constant for the orbiting swarm (real 1/r^2)
const STEAL_BASE = 6;     // orbiters/sec a raider peels, before scaling
const BIG_SOFT = 320;     // attacker mass at which raiding effectiveness halves
const CONSUME_RATIO = 1.35;

class Well {
  constructor(o) {
    this.x = o.x; this.y = o.y; this.vx = 0; this.vy = 0;
    this.coreMass = o.mass; this.orbMass = 0;
    this.orbiters = [];
    this.spin = Math.random() < 0.5 ? -1 : 1;
    this.isPlayer = !!o.isPlayer;
    this.hue = o.hue;
    this.name = o.name || 'well';
    this.collected = 0;
    this.think = rand(0, 0.4); this.target = null; this.state = 'feed';
    this.flash = 0; this._steal = 0;
  }
  mass()   { return this.coreMass + this.orbMass; }
  // reach grows sub-linearly (mass^0.42) so large wells stop ballooning —
  // the snowball flattens and small wells stay competitive
  reachR() { return GR_K * Math.pow(this.mass(), SIZE_EXP); }
  coreR()  { return CORE_K * Math.pow(this.mass(), SIZE_EXP); }
  // smaller wells are nimble; speed falls off as reach grows
  maxSpeed() { return clamp(250 * Math.pow(46 / this.reachR(), 0.5), 40, 380); }

  // add a real orbiting body. Position & velocity are stored RELATIVE to the
  // well's core; gravity does the rest, so the orbit is whatever its momentum
  // makes it. We nudge the tangential component up to a near-circular floor so
  // captures settle into a disk instead of all plunging to the core.
  // seat a body into a coherent near-circular orbit at its arrival radius, with
  // a little eccentricity for life. Real 1/r^2 gravity then evolves it — orbits
  // precess, vary in speed, and the whole disk stays bound within the reach.
  _admit(rx, ry, star) {
    const r = Math.hypot(rx, ry) + 1e-3;
    const soft = this.coreR() * 0.7;
    const vC = Math.sqrt(GRAV * this.mass() / (r + soft));   // circular speed here
    const tx = -ry / r * this.spin, ty = rx / r * this.spin; // tangential (spin dir)
    const rhx = rx / r, rhy = ry / r;                        // radial unit
    const speed = vC * rand(0.84, 1.06);                     // spread -> disk thickness
    const vr = vC * rand(-0.12, 0.12);                       // slight eccentricity
    this.orbiters.push({
      rx, ry, rvx: tx * speed + rhx * vr, rvy: ty * speed + rhy * vr,
      x: 0, y: 0, px: 0, py: 0,
      size: star.size, warm: star.warm, mass: star.mass,
      phase: rand(0, TAU), tw: rand(0.7, 2.6),
    });
    this.orbMass += star.mass;
    this._cap();
  }
  captureStar(star) {                          // hand a free star into orbit at its arrival point
    this._admit(star.x - this.x, star.y - this.y, star);
  }
  receiveOrbiter(o) {                          // a siphoned star arrives at the outer edge
    const r = this.reachR() * rand(0.55, 0.82), a = rand(0, TAU);
    this._admit(Math.cos(a) * r, Math.sin(a) * r, o);
  }
  _cap() {                                     // fold the smallest into the dense core
    while (this.orbiters.length > ORB_CAP) {
      let mi = 0;
      for (let i = 1; i < this.orbiters.length; i++)
        if (this.orbiters[i].mass < this.orbiters[mi].mass) mi = i;
      this.coreMass += this.orbiters[mi].mass;
      this.orbMass  -= this.orbiters[mi].mass;
      this.orbiters.splice(mi, 1);
    }
  }
  popOuter() {                                 // peel the outermost orbiter off
    if (!this.orbiters.length) return null;
    let mi = 0, mr = -1;
    for (let i = 0; i < this.orbiters.length; i++) {
      const o = this.orbiters[i], r = o.rx*o.rx + o.ry*o.ry;
      if (r > mr) { mr = r; mi = i; }
    }
    const o = this.orbiters.splice(mi, 1)[0];
    this.orbMass -= o.mass;
    return { size: o.size, warm: o.warm, mass: o.mass };  // strip to a plain star
  }
}

const HUES = [
  [92,222,212],[240,96,116],[186,122,255],[255,186,88],[150,232,132],[120,166,255],
];
let wells = [], player = null;
function spawnWells() {
  wells = [];
  player = new Well({ x: 0, y: 0, mass: 8, isPlayer: true, hue: [255,242,205], name: 'you' });
  const gal0 = galaxies[0];
  player.x = gal0.x + gal0.r * 0.4; player.y = gal0.y;
  wells.push(player);
  for (let i = 0; i < 6; i++) {
    const gal = galaxies[(i + 1) % galaxies.length];
    const w = new Well({
      x: gal.x + rand(-gal.r, gal.r) * 0.5,
      y: gal.y + rand(-gal.r, gal.r) * 0.5,
      mass: rand(6, 16), hue: HUES[i], name: 'rival ' + (i + 1),
    });
    wells.push(w);
  }
}
function respawnWell(w, mass) {
  const gal = galaxies[(Math.random() * galaxies.length) | 0];
  w.x = gal.x + rand(-gal.r, gal.r) * 0.4;
  w.y = gal.y + rand(-gal.r, gal.r) * 0.4;
  w.coreMass = mass; w.orbMass = 0; w.orbiters = [];
  w.vx = w.vy = 0; w.target = null; w.think = rand(0, 0.4);
}
function consume(strong, weak) {
  bursts.push({ x: weak.x, y: weak.y, r0: weak.coreR() * 1.5, t: 1, hue: strong.hue });
  strong.coreMass += weak.coreMass;
  for (const o of weak.orbiters) {
    if (strong.orbiters.length < ORB_CAP) strong.receiveOrbiter(o);
    else { strong.coreMass += o.mass; strong.orbMass += 0; }
  }
  strong.orbiters.length && strong._cap();
  weak.orbiters = []; weak.orbMass = 0;
  strong.flash = 1;
  if (weak.isPlayer) { respawnWell(weak, 8); showToast('consumed — regrown'); }
  else if (strong.isPlayer) { respawnWell(weak, rand(6, 14)); showToast('swallowed a rival'); }
  else respawnWell(weak, rand(6, 14));
}

let toastT = 0;
function showToast(msg) { toastEl.textContent = msg; toastEl.classList.add('show'); toastT = 1.8; }

// transient combat effects
let beams = [];     // active siphon links this frame (rebuilt each tick)
const bursts = [];  // expanding shock rings from consumes
const siphonState = { raiding: false, raided: false, wasRaiding: false, wasRaided: false };

/* --------------------------- camera ----------------------------- */
const cam = { x: 0, y: 0, zoom: 0.1 };
const overviewCam = () => ({ x: 0, y: 0, zoom: 0.40 * MINSIDE / WORLD_R });
const playZoom = () => clamp(0.34 * MINSIDE / player.reachR(), 0.05, 3.4);

let mode = 'overview', anim = null;
function flyTo(target, to, dur) {
  anim = { t: 0, dur, target, from: { x: cam.x, y: cam.y, zoom: cam.zoom }, to };
}
function enterPlay() {
  if (mode === 'play' || mode === 'diving') return;
  mode = 'diving';
  flyTo('play', { x: player.x, y: player.y, zoom: playZoom() }, 2.7);
  intro.classList.add('gone');
}
function backToOverview() {
  if (mode === 'overview' || mode === 'rising') return;
  mode = 'rising';
  flyTo('overview', overviewCam(), 2.2);
  intro.classList.remove('gone');
}
const toScreen = (wx, wy) => [ (wx - cam.x) * cam.zoom + W/2, (wy - cam.y) * cam.zoom + H/2 ];
const toWorld  = (sx, sy) => [ (sx - W/2) / cam.zoom + cam.x, (sy - H/2) / cam.zoom + cam.y ];

/* --------------------------- input ------------------------------ */
const mouse = { sx: W/2, sy: H/2 };
window.addEventListener('pointermove', e => { mouse.sx = e.clientX; mouse.sy = e.clientY; });
document.getElementById('dive').addEventListener('click', enterPlay);
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') backToOverview();
  else if (e.key === 'r' || e.key === 'R') resetGame();   // dev reset
});
function resetGame() {
  buildWorld(); spawnWells();
  anim = null; mode = 'overview';
  cam.x = 0; cam.y = 0; cam.zoom = overviewCam().zoom;
  intro.classList.remove('gone');
  showToast('world reset');
}
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  cam.zoom = clamp(cam.zoom * (e.deltaY < 0 ? 1.1 : 0.9), 0.03, 4);
}, { passive: false });

/* --------------------------- drawing ---------------------------- */
function starMark(sx, sy, u, warm, tw, spin) {
  const cCore = ramp(warm);
  if (u < 3.2) {
    const s = u * (0.75 + 0.45 * tw);
    ctx.fillStyle = rgba(cCore, Math.min(1, 0.4 + 0.55 * tw));
    ctx.fillRect(sx - s/2, sy - s/2, s, s);
    return;
  }
  const gap = u * 1.7;
  ctx.save();
  ctx.translate(sx, sy); ctx.rotate(spin);
  const cSat = ramp(Math.min(1, warm + 0.1));
  const cDot = ramp(Math.max(0, warm - 0.28));
  const du = u * 0.32;
  for (const [ox, oy] of [[0,-2],[0,2],[-2,0],[2,0]]) {
    ctx.fillStyle = rgba(cDot, 0.5 * tw);
    ctx.fillRect(ox*gap - du/2, oy*gap - du/2, du, du);
  }
  const su = u * 0.6;
  for (const [ox, oy] of [[0,-1],[0,1],[-1,0],[1,0]]) {
    ctx.fillStyle = rgba(cSat, 0.72 * tw);
    ctx.fillRect(ox*gap - su/2, oy*gap - su/2, su, su);
  }
  ctx.fillStyle = rgba(cCore, Math.min(1, 0.85 * tw + 0.15));
  ctx.fillRect(-u/2, -u/2, u, u);
  ctx.fillStyle = rgba(ramp(1), Math.min(1, tw));
  ctx.fillRect(-u*0.2, -u*0.2, u*0.4, u*0.4);
  ctx.restore();
}

function drawBackground() {
  ctx.fillStyle = '#070311'; ctx.fillRect(0, 0, W, H);
  const [pcx, pcy] = toScreen(player.x, player.y);
  const g = ctx.createRadialGradient(pcx, pcy, 0, pcx, pcy, MINSIDE * 0.9);
  g.addColorStop(0, 'rgba(60,18,84,0.35)');
  g.addColorStop(0.5, 'rgba(34,10,54,0.22)');
  g.addColorStop(1, 'rgba(8,3,18,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function drawGalaxyGlows() {
  ctx.globalCompositeOperation = 'lighter';
  for (const gal of galaxies) {
    const [sx, sy] = toScreen(gal.x, gal.y);
    const R = Math.max(6, gal.r * 0.5 * cam.zoom);
    if (sx < -R || sx > W + R || sy < -R || sy > H + R) continue;
    const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, R);
    g.addColorStop(0, 'rgba(255,244,214,0.5)');
    g.addColorStop(0.25, 'rgba(255,196,120,0.28)');
    g.addColorStop(0.6, 'rgba(210,80,140,0.12)');
    g.addColorStop(1, 'rgba(120,40,120,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx, sy, R, 0, TAU); ctx.fill();
  }
}
// faint additive streak between two world points (motion trail)
function streak(wx0, wy0, wx1, wy1, color, alpha, width) {
  const [x0, y0] = toScreen(wx0, wy0), [x1, y1] = toScreen(wx1, wy1);
  ctx.strokeStyle = rgba(color, alpha); ctx.lineWidth = width;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
}
function drawStars() {
  ctx.globalCompositeOperation = 'lighter';
  const m = 40;
  for (const s of stars) {
    const [sx, sy] = toScreen(s.x, s.y);
    if (sx < -m || sx > W + m || sy < -m || sy > H + m) continue;
    const u = s.size * cam.zoom;
    if (u < 0.35) continue;
    const tw = 0.5 + 0.5 * Math.sin(perfNow * s.tw + s.phase);
    if (s.captured) {                      // streak along its infall velocity
      streak(s.x - s.vx*0.035, s.y - s.vy*0.035, s.x, s.y, ramp(s.warm), 0.28, Math.max(1, u*0.5));
    }
    starMark(sx, sy, u, s.warm, tw, s.captured ? Math.atan2(s.vy, s.vx) : s.ha*0.5);
  }
}
function drawWell(w) {
  const [sx, sy] = toScreen(w.x, w.y);
  const rr = w.reachR() * cam.zoom, cc = w.coreR() * cam.zoom;
  if (sx < -rr-60 || sx > W+rr+60 || sy < -rr-60 || sy > H+rr+60) return;

  ctx.globalCompositeOperation = 'lighter';

  // reach field + ring
  const field = ctx.createRadialGradient(sx, sy, cc*0.5, sx, sy, rr);
  field.addColorStop(0, rgba(w.hue, 0.09));
  field.addColorStop(0.7, rgba(w.hue, 0.04));
  field.addColorStop(1, rgba(w.hue, 0));
  ctx.fillStyle = field;
  ctx.beginPath(); ctx.arc(sx, sy, rr, 0, TAU); ctx.fill();
  ctx.lineWidth = 1;
  ctx.strokeStyle = rgba(w.hue, w.isPlayer ? 0.28 : 0.16);
  if (w.isPlayer) ctx.setLineDash([4, 7]); else ctx.setLineDash([]);
  ctx.beginPath(); ctx.arc(sx, sy, rr, 0, TAU); ctx.stroke();
  ctx.setLineDash([]);

  // threat / prey read on rivals: red = it can swallow you, green = you can swallow it.
  // the SOLID inner ring is the "bite zone" — overlap cores to eat.
  if (!w.isPlayer && player && !player._dead) {
    const pm = player.mass(), wm = w.mass();
    let mark = null;
    if (wm > pm * CONSUME_RATIO) mark = [255, 86, 86];
    else if (pm > wm * CONSUME_RATIO) mark = [138, 240, 150];
    if (mark) {
      const pulse = 0.5 + 0.5 * Math.sin(perfNow * 3);
      ctx.strokeStyle = rgba(mark, 0.25 + 0.25 * pulse); ctx.lineWidth = 1.5;
      ctx.setLineDash([3, 6]);
      ctx.beginPath(); ctx.arc(sx, sy, rr * 0.97, 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
      ctx.strokeStyle = rgba(mark, 0.5); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(sx, sy, Math.max(cc * 0.7, 4), 0, TAU); ctx.stroke();
    }
  }

  // orbiting swarm — real bodies, with a velocity streak so motion reads physically
  for (const o of w.orbiters) {
    const [ox, oy] = toScreen(o.x, o.y);
    const u = o.size * cam.zoom;
    if (ox < -20 || ox > W+20 || oy < -20 || oy > H+20 || u < 0.4) continue;
    const speed = Math.hypot(o.rvx, o.rvy);
    if (speed > 30 && u > 0.6) streak(o.px, o.py, o.x, o.y, ramp(o.warm), 0.22, Math.max(1, u*0.45));
    const tw = 0.5 + 0.5 * Math.sin(perfNow * o.tw + o.phase);
    starMark(ox, oy, u, o.warm, tw, Math.atan2(o.rvy, o.rvx));
  }

  // core bloom, tinted by the well's hue, brighter on a flash
  const bloomR = Math.max(cc * 2.0, 9) * (1 + 0.5 * w.flash);
  const bloom = ctx.createRadialGradient(sx, sy, 0, sx, sy, bloomR);
  bloom.addColorStop(0, 'rgba(255,252,240,0.95)');
  bloom.addColorStop(0.28, rgba(w.hue, 0.6));
  bloom.addColorStop(1, rgba(w.hue, 0));
  ctx.fillStyle = bloom;
  ctx.beginPath(); ctx.arc(sx, sy, bloomR, 0, TAU); ctx.fill();
  starMark(sx, sy, clamp(cc * 1.1, 6, 20), 1, 0.9 + 0.1*Math.sin(perfNow*4), perfNow * 0.6);
}
function drawEffects(dt) {
  ctx.globalCompositeOperation = 'lighter';
  // siphon beams: dotted flow from victim toward raider
  for (const bm of beams) {
    const [x0, y0] = toScreen(bm.x0, bm.y0), [x1, y1] = toScreen(bm.x1, bm.y1);
    ctx.strokeStyle = rgba(bm.hue, 0.5); ctx.lineWidth = 1.4;
    ctx.setLineDash([2, 9]); ctx.lineDashOffset = -(perfNow * 90) % 11;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    ctx.setLineDash([]); ctx.lineDashOffset = 0;
  }
  // consume shock rings
  for (let i = bursts.length - 1; i >= 0; i--) {
    const b = bursts[i];
    b.t -= dt * 1.3;
    if (b.t <= 0) { bursts.splice(i, 1); continue; }
    const [x, y] = toScreen(b.x, b.y);
    const R = (b.r0 + (1 - b.t) * b.r0 * 6) * cam.zoom;
    ctx.strokeStyle = rgba(b.hue, b.t * 0.7); ctx.lineWidth = 2 * b.t + 0.5;
    ctx.beginPath(); ctx.arc(x, y, R, 0, TAU); ctx.stroke();
  }
}
function drawBoundary() {
  const [sx, sy] = toScreen(0, 0);
  const R = WORLD_R * cam.zoom;
  ctx.save();
  ctx.globalCompositeOperation = 'source-over';
  ctx.beginPath(); ctx.rect(0, 0, W, H);
  ctx.arc(sx, sy, R, 0, TAU, true);
  ctx.fillStyle = 'rgba(5,2,12,0.66)'; ctx.fill('evenodd');
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,196,110,0.32)';
  ctx.shadowColor = 'rgba(255,170,90,0.8)'; ctx.shadowBlur = 18;
  ctx.beginPath(); ctx.arc(sx, sy, R, 0, TAU); ctx.stroke();
  ctx.restore();
}
function drawMinimap() {
  const mmR = clamp(MINSIDE * 0.11, 56, 92);
  const cxm = W - 20 - mmR, cym = 20 + mmR;
  const scale = mmR / WORLD_R;                 // world is centered on (0,0)

  ctx.save();
  ctx.globalCompositeOperation = 'source-over';

  // dish + boundary
  ctx.beginPath(); ctx.arc(cxm, cym, mmR, 0, TAU);
  ctx.fillStyle = 'rgba(10,5,20,0.5)'; ctx.fill();
  ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,196,110,0.32)'; ctx.stroke();

  ctx.save();
  ctx.beginPath(); ctx.arc(cxm, cym, mmR, 0, TAU); ctx.clip();

  // the slice of world currently on screen
  const [wx0, wy0] = toWorld(0, 0);
  const [wx1, wy1] = toWorld(W, H);
  const rx = cxm + wx0 * scale, ry = cym + wy0 * scale;
  const rw = (wx1 - wx0) * scale, rh = (wy1 - wy0) * scale;
  ctx.fillStyle = 'rgba(226,208,255,0.07)'; ctx.fillRect(rx, ry, rw, rh);
  ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(226,208,255,0.6)'; ctx.strokeRect(rx, ry, rw, rh);

  // wells — colored dots; you outlined white, threats red, prey green
  const pm = player.mass();
  for (const w of wells) {
    const dx = cxm + w.x * scale, dy = cym + w.y * scale;
    const r = clamp(Math.sqrt(w.mass()) * 0.06, 1.6, 5.5);
    ctx.beginPath(); ctx.arc(dx, dy, r, 0, TAU);
    ctx.fillStyle = rgba(w.hue, 0.95); ctx.fill();
    let outline = null;
    if (w.isPlayer) outline = [255, 255, 255];
    else if (w.mass() > pm * CONSUME_RATIO) outline = [255, 86, 86];
    else if (pm > w.mass() * CONSUME_RATIO) outline = [138, 240, 150];
    if (outline) { ctx.lineWidth = 1.3; ctx.strokeStyle = rgba(outline, 0.95); ctx.stroke(); }
  }
  ctx.restore();
  ctx.restore();
}
function drawCursor() {
  const x = mouse.sx, y = mouse.sy;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = 'rgba(255,225,160,0.5)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(x, y, 7, 0, TAU); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x-11, y); ctx.lineTo(x-3, y); ctx.moveTo(x+3, y); ctx.lineTo(x+11, y);
  ctx.moveTo(x, y-11); ctx.lineTo(x, y-3); ctx.moveTo(x, y+3); ctx.lineTo(x, y+11);
  ctx.stroke();
  ctx.restore();
}

/* ------------------------- simulation --------------------------- */
function botThink(w, dt) {
  w.think -= dt;
  if (w.think > 0) return;
  w.think = 0.35;
  const myMass = w.mass();
  let threat = null, tD = 1e9, prey = null, pD = 1e9;
  for (const o of wells) {
    if (o === w) continue;
    const d = Math.hypot(o.x - w.x, o.y - w.y);
    if (o.mass() > myMass * 1.15 && d < 1600 && d < tD) { threat = o; tD = d; }
    if (o.mass() * 1.15 < myMass && o.orbiters.length > 3 && d < 1400 && d < pD) { prey = o; pD = d; }
  }
  if (threat) { w.target = [w.x + (w.x - threat.x), w.y + (w.y - threat.y)]; w.state = 'flee'; return; }
  if (prey)   { w.target = [prey.x, prey.y]; w.state = 'hunt'; return; }
  let bx = w.x, by = w.y, bd = 1e9;              // sample the field for nearby food
  for (let k = 0; k < 48; k++) {
    const s = stars[(Math.random() * stars.length) | 0];
    const d = Math.hypot(s.x - w.x, s.y - w.y);
    if (d < bd) { bd = d; bx = s.x; by = s.y; }
  }
  w.target = [bx, by]; w.state = 'feed';
}
function moveWell(w, dt) {
  if (!w.target) return;
  const dx = w.target[0] - w.x, dy = w.target[1] - w.y;
  const d = Math.hypot(dx, dy) + 1e-4;
  const spd = Math.min(w.maxSpeed(), d * 3.2);
  w.vx = dx / d * spd; w.vy = dy / d * spd;
  w.x += w.vx * dt; w.y += w.vy * dt;
  const pr = Math.hypot(w.x, w.y), lim = WORLD_R - w.coreR();
  if (pr > lim) { w.x *= lim / pr; w.y *= lim / pr; }
}

function updateStars(dt) {
  for (const s of stars) {
    // find the strongest well whose reach holds this star
    let best = null, bestPull = 0, bd = 0, bdx = 0, bdy = 0, brr = 0;
    for (const w of wells) {
      const dx = w.x - s.x, dy = w.y - s.y, d2 = dx*dx + dy*dy;
      const rr = w.reachR();
      if (d2 < rr*rr) {
        const d = Math.sqrt(d2) + 1e-4, f = 1 - d/rr, pull = f*f*w.mass();
        if (pull > bestPull) { bestPull = pull; best = w; bd = d; bdx = dx; bdy = dy; brr = rr; }
      }
    }
    if (best) {
      if (!s.captured) { s.captured = true; s.vx = -Math.sin(s.ha)*s.hr*s.om; s.vy = Math.cos(s.ha)*s.hr*s.om; }
      // spiral infall: radial pull toward the well + a tangential swirl so
      // the star curves in and streams into the disk instead of dropping
      const ux = bdx/bd, uy = bdy/bd;
      const tx = -uy * best.spin, ty = ux * best.spin;
      const f = 1 - bd/brr;
      const a = PULL * dt * (0.4 + 0.6 * f);
      const sw = SWIRL * dt * f;
      s.vx += ux * a + tx * sw; s.vy += uy * a + ty * sw;
      s.vx *= 0.99; s.vy *= 0.99;
      const v = Math.hypot(s.vx, s.vy);
      if (v > 1600) { s.vx *= 1600/v; s.vy *= 1600/v; }
      s.x += s.vx * dt; s.y += s.vy * dt;
      // hand off into a real orbit carrying its momentum — no snap to a ring
      if (bd < brr * CAPTURE_BAND) {
        best.captureStar(s);
        if (best.isPlayer) best.collected++;
        respawnStar(s);
      }
      continue;
    }
    if (s.captured) s.captured = false;
    s.ha += s.om * dt;
    s.x = s.gx + Math.cos(s.ha) * s.hr;
    s.y = s.gy + Math.sin(s.ha) * s.hr;
  }
}
function updateOrbiters(dt) {
  for (const w of wells) {
    const M = w.mass();
    const soft = w.coreR() * 0.7, soft2 = soft * soft;
    const mergeR = w.coreR() * 0.55, mergeR2 = mergeR * mergeR;
    const vCap = Math.sqrt(GRAV * M / soft) * 1.7;   // keep the integrator stable
    for (let i = w.orbiters.length - 1; i >= 0; i--) {
      const o = w.orbiters[i];
      o.px = o.x; o.py = o.y;
      const r2 = o.rx*o.rx + o.ry*o.ry, r = Math.sqrt(r2) + 1e-4;
      // real 1/r^2 gravity toward the core (softened), semi-implicit Euler
      const a = GRAV * M / (r2 + soft2);
      o.rvx -= (o.rx / r) * a * dt;
      o.rvy -= (o.ry / r) * a * dt;
      const v = Math.hypot(o.rvx, o.rvy);
      if (v > vCap) { o.rvx *= vCap/v; o.rvy *= vCap/v; }
      o.rx += o.rvx * dt; o.ry += o.rvy * dt;
      o.x = w.x + o.rx; o.y = w.y + o.ry;
      // accretion: an orbiter that falls into the core merges into it
      if (o.rx*o.rx + o.ry*o.ry < mergeR2) {
        w.coreMass += o.mass; w.orbMass -= o.mass;
        w.orbiters.splice(i, 1);
        w.flash = Math.max(w.flash, 0.25);
      }
    }
    if (w.flash > 0) w.flash = Math.max(0, w.flash - dt * 2);
  }
}
function wellClashes(dt) {
  for (let i = 0; i < wells.length; i++) {
    for (let j = i + 1; j < wells.length; j++) {
      const a = wells[i], b = wells[j];
      const big = a.mass() >= b.mass() ? a : b;
      const small = big === a ? b : a;
      const d = Math.hypot(big.x - small.x, big.y - small.y);

      // BIG can only win by engulfing the small core — and small is fast,
      // so catching it is hard. This is the only way a large well grows by combat.
      if (d < big.coreR() * 0.7 && big.mass() > small.mass() * CONSUME_RATIO) {
        consume(big, small); continue;
      }

      // SIPHON favours the underdog: the smaller well, diving into the bigger
      // one's field, peels stars off its outer swarm. Rate rises with the size
      // gap (David bites Goliath) and falls as the raider itself grows large.
      if (d < big.reachR() * 0.95 && big.orbiters.length && small.mass() < big.mass() * 0.9) {
        const gap = clamp(big.mass() / Math.max(1, small.mass()), 1, 8);
        const rate = STEAL_BASE * Math.sqrt(gap) / (1 + small.mass() / BIG_SOFT);
        small._steal += rate * dt;
        let took = 0;
        while (small._steal >= 1 && big.orbiters.length) {
          const o = big.popOuter();
          if (o) small.receiveOrbiter(o);
          small._steal -= 1; took++;
          small.flash = Math.max(small.flash, 0.5);
          big.flash = Math.max(big.flash, 0.3);
        }
        beams.push({ x0: big.x, y0: big.y, x1: small.x, y1: small.y, hue: small.hue });
        if (took) {
          if (small.isPlayer) siphonState.raiding = true;
          if (big.isPlayer) siphonState.raided = true;
        }
      }
    }
  }
}

/* ----------------------------- loop ----------------------------- */
buildWorld();
spawnWells();
cam.x = 0; cam.y = 0; cam.zoom = overviewCam().zoom;

let perfNow = 0, last = performance.now();
function frame(now) {
  const dt = Math.min(0.045, (now - last) / 1000);
  last = now; perfNow = now / 1000;
  const live = (mode === 'play');

  if (live) {
    const [tx, ty] = toWorld(mouse.sx, mouse.sy);
    player.target = [tx, ty];
    for (const w of wells) { if (!w.isPlayer) botThink(w, dt); moveWell(w, dt); }
    updateStars(dt);
    beams = []; siphonState.raiding = false; siphonState.raided = false;
    wellClashes(dt);
    // announce siphon state on the rising edge only
    if (siphonState.raiding && !siphonState.wasRaiding) showToast('siphoning ↯');
    else if (siphonState.raided && !siphonState.wasRaided) showToast('being siphoned!');
    siphonState.wasRaiding = siphonState.raiding;
    siphonState.wasRaided = siphonState.raided;
  }
  updateOrbiters(dt);

  // camera
  if (anim) {
    anim.t += dt;
    const k = clamp01(anim.t / anim.dur), e = easeInOut(k);
    cam.x = lerp(anim.from.x, mode === 'diving' ? player.x : anim.to.x, e);
    cam.y = lerp(anim.from.y, mode === 'diving' ? player.y : anim.to.y, e);
    cam.zoom = lerp(anim.from.zoom, anim.to.zoom, e);
    if (k >= 1) { mode = anim.target; anim = null; }
  } else if (mode === 'play') {
    cam.x += (player.x - cam.x) * Math.min(1, dt * 6);
    cam.y += (player.y - cam.y) * Math.min(1, dt * 6);
    cam.zoom += (playZoom() - cam.zoom) * Math.min(1, dt * 2.2);
  } else if (mode === 'overview') {
    cam.x += (0 - cam.x) * Math.min(1, dt * 2);
    cam.y += (0 - cam.y) * Math.min(1, dt * 2);
  }

  drawBackground();
  drawGalaxyGlows();
  drawStars();
  if (mode !== 'overview') { for (const w of wells) drawWell(w); drawEffects(dt); }
  drawBoundary();
  ctx.globalCompositeOperation = 'source-over';
  const wantCursor = mode === 'play' ? 'none' : 'default';
  if (canvas.style.cursor !== wantCursor) canvas.style.cursor = wantCursor;
  if (mode !== 'overview') drawMinimap();
  if (mode === 'play') drawCursor();

  // toast fade
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) toastEl.classList.remove('show'); }

  // hud
  massEl.textContent = Math.round(player.mass()).toLocaleString();
  starsEl.textContent = player.collected.toLocaleString();
  reachEl.textContent = Math.round(player.reachR()).toLocaleString();
  let rank = 1; const pm = player.mass();
  for (const w of wells) if (!w.isPlayer && w.mass() > pm) rank++;
  rankEl.textContent = '#' + rank + ' / ' + wells.length;

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
