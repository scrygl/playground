<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Twinkle Galaxy — agar visual</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0a0416; }
  #stage { display: block; width: 100vw; height: 100vh; cursor: crosshair; }

  .hud {
    position: fixed; left: 16px; bottom: 14px;
    font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
    color: #d9b6ff; letter-spacing: .04em;
    text-shadow: 0 0 8px rgba(120,40,180,.6);
    pointer-events: none; user-select: none; opacity: .82;
  }
  .hud b { color: #ffe9a8; font-weight: 600; }
  .hint {
    position: fixed; right: 16px; bottom: 14px;
    font: 12px/1.5 ui-monospace, Menlo, monospace;
    color: #a884c8; opacity: .5; pointer-events: none; user-select: none;
    transition: opacity .6s ease;
  }

  /* --- intro overlay --- */
  #intro {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 26px; text-align: center;
    pointer-events: none;               /* only the button is clickable */
    transition: opacity .9s ease;
  }
  #intro.gone { opacity: 0; }
  #intro h1 {
    margin: 0;
    font: 300 clamp(34px, 8vw, 88px)/0.98 "Avenir Next", "Segoe UI", system-ui, sans-serif;
    letter-spacing: .22em; text-indent: .22em;
    color: #fff;
    text-shadow: 0 0 34px rgba(255,190,110,.55), 0 0 70px rgba(190,60,160,.35);
  }
  #intro .sub {
    font: 12px/1.6 ui-monospace, Menlo, monospace;
    letter-spacing: .38em; text-indent: .38em;
    color: #e6b7ff; opacity: .72; text-transform: uppercase;
  }
  #dive {
    pointer-events: auto; cursor: pointer;
    margin-top: 6px;
    padding: 13px 30px;
    background: rgba(255,214,120,.06);
    border: 1px solid rgba(255,205,120,.5);
    border-radius: 999px;
    color: #ffe6ad;
    font: 600 13px/1 ui-monospace, Menlo, monospace;
    letter-spacing: .28em; text-indent: .28em; text-transform: uppercase;
    backdrop-filter: blur(3px);
    transition: background .25s ease, box-shadow .25s ease, transform .25s ease, border-color .25s ease;
  }
  #dive:hover {
    background: rgba(255,214,120,.16);
    border-color: rgba(255,224,150,.9);
    box-shadow: 0 0 34px rgba(255,180,90,.35);
    transform: translateY(-1px);
  }
  #dive:active { transform: translateY(0); }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div id="intro">
  <div class="sub">an agar toy · work in progress</div>
  <h1>TWINKLE&nbsp;GALAXY</h1>
  <button id="dive" type="button">dive in ↯</button>
</div>

<div class="hud">twinkle&nbsp;galaxy &nbsp;·&nbsp; <b id="count">0</b> cells</div>
<div class="hint" id="hint">drag to swing the disk · scroll to zoom</div>

<script>
/* ------------------------------------------------------------------ *
 *  Twinkle Galaxy
 *  A dense spiral disk of agar-style "cells". Each cell is a little
 *  square that twinkles; the larger ones bloom into the diamond mark:
 *
 *              .
 *              o
 *          . o [] o .
 *              o
 *              .
 *
 *  Two views, one continuous camera:
 *    galaxy  — a tilted, slowly turning spiral disk floating in space
 *    arena   — "dive in": the camera flies inward and the disk's tilt
 *              equalizes to 1.0, flattening the ellipse into a true
 *              circle — the circular game space, ringed by a boundary.
 *
 *  Color rides a MATLAB-ish sunset ramp keyed to radius: white-gold
 *  core -> orange -> magenta -> deep purple rim.
 * ------------------------------------------------------------------ */

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const countEl = document.getElementById('count');
const intro = document.getElementById('intro');
const hint = document.getElementById('hint');

let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

/* ---- MATLAB-ish sunset ramp, sampled per cell by radius ---- */
const STOPS = [
  [0.00, [255, 252, 232]],  // white-gold  (core)
  [0.14, [255, 216, 120]],  // gold
  [0.32, [248, 148, 58]],   // orange
  [0.52, [226, 84,  96]],   // rose-red
  [0.70, [176, 44, 132]],   // magenta
  [0.86, [96,  22, 128]],   // violet
  [1.00, [40,  10,  60]],   // deep purple (rim)
];
function ramp(t) {
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  for (let i = 1; i < STOPS.length; i++) {
    if (t <= STOPS[i][0]) {
      const [t0, c0] = STOPS[i - 1];
      const [t1, c1] = STOPS[i];
      const f = (t - t0) / (t1 - t0);
      return [
        c0[0] + (c1[0] - c0[0]) * f,
        c0[1] + (c1[1] - c0[1]) * f,
        c0[2] + (c1[2] - c0[2]) * f,
      ];
    }
  }
  return STOPS[STOPS.length - 1][1];
}
const rgba = (c, a) => `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp01 = t => t < 0 ? 0 : t > 1 ? 1 : t;
const easeInOut = t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
const TAU = Math.PI * 2;
const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;

/* --------------------------- camera ------------------------------ */
// the two poses the camera moves between
const GALAXY = { tilt: 0.5, roll: -0.35, zoom: 0.56 };
const ARENA  = { tilt: 1.0, roll:  0.0,  zoom: 0.92 };

const view = { tilt: GALAXY.tilt, roll: GALAXY.roll, zoom: GALAXY.zoom, cx: 0, cy: 0 };
let mode = 'galaxy';           // 'galaxy' | 'arena'
let reveal = 0;                // 0 = galaxy look, 1 = arena look (boundary etc.)
let anim = null;               // active transition

function flyTo(target) {
  const to = target === 'arena' ? ARENA : GALAXY;
  anim = {
    t: 0, dur: 2.4, target,
    from: { tilt: view.tilt, roll: view.roll, zoom: view.zoom },
    to,
  };
}
function enterArena() {
  if (mode === 'arena' || (anim && anim.target === 'arena')) return;
  flyTo('arena');
  intro.classList.add('gone');
  hint.textContent = 'move to steer · scroll to zoom · esc to pull back out';
}
function backToGalaxy() {
  if (mode === 'galaxy' && !anim) return;
  flyTo('galaxy');
  intro.classList.remove('gone');
  hint.textContent = 'drag to swing the disk · scroll to zoom';
}

const ARMS = 3;
const WIND = 2.6;
let MAXR = 1;

class Cell {
  constructor() { this.reset(); }
  reset() {
    const rr = Math.pow(Math.random(), 0.62);
    this.r = rr;
    const arm = (Math.floor(Math.random() * ARMS) / ARMS) * TAU;
    const scatter = gauss() * (0.28 + 0.5 * rr);
    this.a = arm + rr * WIND * TAU + scatter;
    this.omega = 0.045 * (0.22 + 0.78 / (rr + 0.18));
    const big = Math.random() < 0.06;
    this.unit = big ? rand(9, 20) : rand(1.4, 5.5);
    this.big = big && this.unit > 11;
    this.phase = rand(0, TAU);
    this.twSpeed = rand(0.7, 2.6);
    this.warm = Math.min(1, Math.max(0, this.r + gauss() * 0.06));
  }

  step(dt) { this.a += this.omega * dt; }

  draw(scale, spin) {
    const rad = this.r * MAXR * scale;
    const ang = this.a + spin;
    let px = Math.cos(ang) * rad;
    let py = Math.sin(ang) * rad * view.tilt;
    const cr = Math.cos(view.roll), sr = Math.sin(view.roll);
    const x = view.cx + (px * cr - py * sr);
    const y = view.cy + (px * sr + py * cr);

    const tw = 0.5 + 0.5 * Math.sin(perfNow * this.twSpeed + this.phase);
    const cCore = ramp(this.warm * 0.9);
    const u = this.unit * scale;

    if (!this.big) {
      ctx.fillStyle = rgba(cCore, Math.min(1, 0.35 + 0.6 * tw));
      const s = u * (0.7 + 0.5 * tw);
      ctx.fillRect(x - s / 2, y - s / 2, s, s);
      return;
    }

    const gap = u * 1.7;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(this.a * 0.5);

    const cSat = ramp(Math.min(1, this.warm * 0.9 + 0.12));
    const cDot = ramp(Math.min(1, this.warm * 0.9 + 0.28));

    const du = u * 0.32;
    for (const [ox, oy] of [[0,-2],[0,2],[-2,0],[2,0]]) {
      ctx.fillStyle = rgba(cDot, 0.5 * tw);
      ctx.fillRect(ox*gap - du/2, oy*gap - du/2, du, du);
    }
    const su = u * 0.6;
    for (const [ox, oy] of [[0,-1],[0,1],[-1,0],[1,0]]) {
      ctx.fillStyle = rgba(cSat, 0.72 * tw);
      ctx.fillRect(ox*gap - su/2, oy*gap - su/2, su, su);
    }
    ctx.fillStyle = rgba(cCore, Math.min(1, 0.85 * tw + 0.15));
    ctx.fillRect(-u/2, -u/2, u, u);
    ctx.fillStyle = rgba(ramp(0), Math.min(1, tw));
    ctx.fillRect(-u*0.21, -u*0.21, u*0.42, u*0.42);
    ctx.restore();
  }
}

/* --------------------------- backdrop ---------------------------- */
function drawBackground() {
  ctx.fillStyle = '#0a0416';
  ctx.fillRect(0, 0, W, H);

  const g = ctx.createRadialGradient(view.cx, view.cy, 0, view.cx, view.cy, Math.max(W, H) * 0.75);
  g.addColorStop(0.0, 'rgba(70,20,90,0.42)');
  g.addColorStop(0.4, 'rgba(40,12,64,0.28)');
  g.addColorStop(1.0, 'rgba(10,4,22,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawCore(scale) {
  const r = MAXR * scale * 0.26;
  const g = ctx.createRadialGradient(view.cx, view.cy, 0, view.cx, view.cy, r);
  g.addColorStop(0.0, 'rgba(255,252,236,0.95)');
  g.addColorStop(0.18, 'rgba(255,222,140,0.7)');
  g.addColorStop(0.5, 'rgba(240,120,80,0.28)');
  g.addColorStop(1.0, 'rgba(150,40,120,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(view.cx, view.cy, r, 0, TAU);
  ctx.fill();
}

/* circular arena boundary — fades in as the disk equalizes */
function drawArena(scale) {
  if (reveal <= 0.001) return;
  const R = MAXR * scale;

  // darken the void outside the circle so the arena reads as contained
  ctx.save();
  ctx.globalCompositeOperation = 'source-over';
  ctx.beginPath();
  ctx.rect(0, 0, W, H);
  ctx.arc(view.cx, view.cy, R, 0, TAU, true);   // even-odd hole
  ctx.fillStyle = `rgba(6,2,14,${0.6 * reveal})`;
  ctx.fill('evenodd');
  ctx.restore();

  // glowing rim
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineWidth = 2;
  ctx.strokeStyle = `rgba(255,196,110,${0.5 * reveal})`;
  ctx.shadowColor = 'rgba(255,170,90,0.9)';
  ctx.shadowBlur = 22 * reveal;
  ctx.beginPath();
  ctx.arc(view.cx, view.cy, R, 0, TAU);
  ctx.stroke();

  // faint second ring, cool
  ctx.lineWidth = 1;
  ctx.shadowBlur = 0;
  ctx.strokeStyle = `rgba(190,110,220,${0.25 * reveal})`;
  ctx.beginPath();
  ctx.arc(view.cx, view.cy, R * 1.012, 0, TAU);
  ctx.stroke();
  ctx.restore();
}

/* ----------------------------- loop ------------------------------ */
let cells = [];
function populate() {
  view.cx = W / 2; view.cy = H / 2;
  MAXR = Math.min(W, H) * 0.52;
  const target = Math.round((W * H) / 1500);
  const n = Math.max(500, Math.min(2200, target));
  cells = Array.from({ length: n }, () => new Cell());
  countEl.textContent = n.toLocaleString();
}
populate();
window.addEventListener('resize', populate);

/* -------- interaction -------- */
document.getElementById('dive').addEventListener('click', enterArena);
window.addEventListener('keydown', e => { if (e.key === 'Escape') backToGalaxy(); });

// drag to swing the disk (galaxy view only, when the camera is still)
let dragging = false, lastX = 0;
canvas.addEventListener('pointerdown', e => {
  if (mode === 'galaxy' && !anim) { dragging = true; lastX = e.clientX; }
});
window.addEventListener('pointerup', () => dragging = false);
window.addEventListener('pointermove', e => {
  if (dragging) { view.roll += (e.clientX - lastX) * 0.004; lastX = e.clientX; }
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  view.zoom = Math.max(0.4, Math.min(2.6, view.zoom * (e.deltaY < 0 ? 1.08 : 0.926)));
}, { passive: false });

let perfNow = 0, last = performance.now(), spin = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  perfNow = now / 1000;

  // camera transition
  if (anim) {
    anim.t += dt;
    const k = clamp01(anim.t / anim.dur);
    const e = easeInOut(k);
    view.tilt = lerp(anim.from.tilt, anim.to.tilt, e);
    view.roll = lerp(anim.from.roll, anim.to.roll, e);
    view.zoom = lerp(anim.from.zoom, anim.to.zoom, e);
    reveal = anim.target === 'arena' ? e : 1 - e;
    if (k >= 1) { mode = anim.target; anim = null; }
  }

  // disk keeps turning; slower once you're inside the arena
  spin += dt * (mode === 'arena' && !anim ? 0.06 : 0.02);

  drawBackground();

  const scale = view.zoom;
  ctx.globalCompositeOperation = 'lighter';
  drawCore(scale);
  cells.sort((a, b) => b.r - a.r);
  for (const c of cells) { c.step(dt); c.draw(scale, spin); }
  ctx.globalCompositeOperation = 'source-over';

  drawArena(scale);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
