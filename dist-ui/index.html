<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Velocity Horizon — UI harness</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #04060f;
        overflow: hidden;
      }
      /* Stand-in for the live 3D canvas the UI overlays. */
      #stage {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(80% 60% at 70% 30%, #123055 0%, transparent 70%),
          radial-gradient(60% 50% at 20% 80%, #3a1030 0%, transparent 70%),
          linear-gradient(180deg, #050a1e, #02030a);
      }
      #stage::after {
        content: '';
        position: absolute;
        inset: 0;
        background-image: repeating-linear-gradient(
            115deg,
            rgba(56, 225, 255, 0.07) 0 2px,
            transparent 2px 90px
          ),
          repeating-linear-gradient(65deg, rgba(255, 45, 117, 0.05) 0 2px, transparent 2px 140px);
      }
    </style>
    <script type="module" crossorigin src="./assets/uitest-O7cwHKV0.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/uitest-BGlsJbqj.css">
  </head>
  <body>
    <div id="stage"></div>
    <div id="ui"></div>
  </body>
</html>
